[project]
name = "slot-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "asmina", email = "asminaa439@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
slot-planner = "slot_planner:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call real LLM providers (deselect with '-m \"not integration\"')",
]
